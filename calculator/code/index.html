<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Calculator app</title>
  </head>
  <body>
    <div class="calculator">
      <div class="calculator__header">
        <h1 class="calculator__title">calc</h1>
        <div class="theme-switcher">
          <div class="theme-switcher__options">
            <div class="theme-switcher__numbers">
              <span class="theme-switcher__number">1</span>
              <span class="theme-switcher__number">2</span>
              <span class="theme-switcher__number">3</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px">
            <span class="theme-switcher__label">Theme</span>
            <div class="theme-switcher__toggle">
              <div class="theme-switcher__toggle-ball"></div>
            </div>
          </div>
          </div>
        </div>
      </div>
      <div class="calculator__display">0</div>
      <div class="calculator__keypad">
        <button class="calculator__key calculator__key--num">7</button>
        <button class="calculator__key calculator__key--num">8</button>
        <button class="calculator__key calculator__key--num">9</button>
        <button class="calculator__key calculator__key--del">DEL</button>
        <button class="calculator__key calculator__key--num">4</button>
        <button class="calculator__key calculator__key--num">5</button>
        <button class="calculator__key calculator__key--num">6</button>
        <button class="calculator__key calculator__key--op">+</button>
        <button class="calculator__key calculator__key--num">1</button>
        <button class="calculator__key calculator__key--num">2</button>
        <button class="calculator__key calculator__key--num">3</button>
        <button class="calculator__key calculator__key--op">-</button>
        <button class="calculator__key calculator__key--num">.</button>
        <button class="calculator__key calculator__key--num">0</button>
        <button class="calculator__key calculator__key--op">/</button>
        <button class="calculator__key calculator__key--op">x</button>
        <button class="calculator__key calculator__key--reset">RESET</button>
        <button class="calculator__key calculator__key--equals">=</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
