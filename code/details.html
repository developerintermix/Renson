<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View detailed information about countries including population, region, capital, and more. Explore country details in dark or light mode." />
    <title>Country Details</title>
    <link rel="stylesheet" href="style_details.css" />
  </head>

  <body class="page">
    <header class="header">
      <div class="header__title"><h1>Where in the world?</h1></div>
      <div class="header__theme">
        <button class="header__theme-button" id="theme-mode" aria-label="Toggle Dark Mode">
          <img class="header__theme-icon" src="../assets/lightmode.svg" alt="Light Mode Icon" />
          <img class="header__theme-icon" src="../assets/darkmode.svg" alt="Dark Mode Icon" />
          Toggle Dark Mode
        </button>
      </div>
    </header>

    <main class="main-content">
      <div class="main-content__back">
        <button class="main-content__back-button" onclick="goBack()" aria-label="Go back to previous page">
          <img class="main-content__back-icon" src="../assets/back.svg" alt="Back Button Icon" />Back
        </button>
      </div>
      <div id="country-details" class="main-content__details" aria-live="polite"></div> <!-- Added aria-live -->
    </main>
    
    <script src="main.js"></script>
  </body>
</html>
