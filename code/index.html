<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore countries around the world with details like population, capital, region, and more. Search and filter countries easily." />
    <title>Where in the world?</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__title">
        <h1>Where in the world?</h1>
      </div>
      <div class="topbar__theme">
        <button class="theme-mode" id="theme-mode" aria-label="Toggle dark mode">
          <img class="theme-mode__icon theme-mode__icon--light" src="../assets/lightmode.svg" alt="light mode" />
          <img class="theme-mode__icon theme-mode__icon--dark" src="../assets/darkmode.svg" alt="dark mode" />
          <span class="theme-mode__text">Dark Mode</span>
        </button>
      </div>
    </header>
    
    <main class="container">
      <div class="search-filter">
        <div class="search">
          <img class="search__icon" src="../assets/search.svg" alt="Search countries" />
          <input
            class="search__input"
            type="text"
            name="search"
            id="search"
            oninput="search()"
            placeholder="Search for a country..."
            aria-label="Search for a country"
          />
        </div>

        <select class="filter" name="Region" id="Filter" onchange="filter()" aria-label="Filter countries by region">
          <option class="filter__option" value="All">All Regions</option> <!-- Reset Option -->
          <option class="filter__option" value="Africa">Africa</option>
          <option class="filter__option" value="Asia">Asia</option>
          <option class="filter__option" value="America">America</option>
          <option class="filter__option" value="Europe">Europe</option>
          <option class="filter__option" value="Oceania">Oceania</option>
        </select>    
      </div>

      <div id="countries-components" class="countries" aria-live="polite"></div> <!-- Added aria-live to announce dynamic content changes -->
    </main>

    <script src="main.js"></script>
  </body>
</html>
